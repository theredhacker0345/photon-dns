[package]
name = "neuron-encrypt"
version = "2.1.2"
edition = "2021"
description = "Android-only cryptographic core derived from Neuron Encrypt 2.1.2"
license = "GPL-3.0-only"
repository = "https://gitlab.com/theredhacker0345/neuron-encrypt"
publish = false

[lib]
name = "neuron_encrypt_core"
path = "src/lib.rs"

# This manifest deliberately contains only the GPL-compatible cryptographic
# core used by Pocket Relay's JNI bridge. The upstream desktop UI/CLI graph is
# excluded so F-Droid can reproduce the Android library from a small, auditable
# offline closure rather than vendoring hundreds of irrelevant desktop crates.
[dependencies]
aead = { version = "0.5", features = ["stream"] }
aes-gcm-siv = { version = "0.11", features = ["std", "aes"] }
argon2 = { version = "0.5", features = ["std"] }
hex = "0.4.3"
hkdf = "0.12"
rand_core = { version = "0.6", features = ["getrandom"] }
sha2 = "0.10"
thiserror = "1.0.61"
zeroize = { version = "1.7", features = ["derive"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
