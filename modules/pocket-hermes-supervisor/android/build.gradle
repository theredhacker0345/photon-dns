buildscript {
  repositories {
    mavenCentral()
  }
  dependencies {
    // Chaquopy 16.1 supports the F-Droid build server's Python 3.13 host while
    // retaining the embedded CPython 3.11 Android runtime target.
    classpath "com.chaquo.python:gradle:16.1.0"
  }
}

apply plugin: 'com.android.library'
apply plugin: 'com.chaquo.python'

group = 'expo.modules.pockethermessupervisor'
version = ''

dependencies {
  implementation "androidx.security:security-crypto:1.1.0-alpha06"
}

def expoModulesCorePlugin = new File(project(":expo-modules-core").projectDir.absolutePath, "ExpoModulesCorePlugin.gradle")
def pocketHermesAbis = (System.getenv("POCKET_HERMES_ANDROID_ABIS") ?: "arm64-v8a")
  .split(",")
  .collect { it.trim() }
def pocketHermesEmulatorTestBuild = System.getenv("POCKET_HERMES_EMULATOR_TEST_BUILD") == "true"
apply from: expoModulesCorePlugin
applyKotlinExpoModulesCorePlugin()
useCoreDependencies()
useExpoPublishing()

// If you want to use the managed Android SDK versions from expo-modules-core, set this to true.
// The Android SDK versions will be bumped from time to time in SDK releases and may introduce breaking changes in your module code.
// Most of the time, you may like to manage the Android SDK versions yourself.
def useManagedAndroidSdkVersions = false
if (useManagedAndroidSdkVersions) {
  useDefaultAndroidSdkVersions()
} else {
  buildscript {
    // Simple helper that allows the root project to override versions declared by this library.
    ext.safeExtGet = { prop, fallback ->
      rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
    }
  }
  project.android {
    compileSdkVersion safeExtGet("compileSdkVersion", 36)
    ndkVersion "27.1.12297006"
    defaultConfig {
      minSdkVersion safeExtGet("minSdkVersion", 24)
      targetSdkVersion safeExtGet("targetSdkVersion", 36)
      ndk {
        abiFilters(*pocketHermesAbis)
      }
      externalNativeBuild {
        cmake {
          cppFlags "-std=c11"
        }
      }
    }
    externalNativeBuild {
      cmake {
        path file("src/main/cpp/CMakeLists.txt")
        version "3.22.1"
      }
    }
  }
}

android {
  namespace "expo.modules.pockethermessupervisor"
  buildFeatures {
    aidl true
  }
  defaultConfig {
    versionCode 1
    versionName ""
  }
  lintOptions {
    abortOnError false
  }
}

// Build the pure-Python Hermes wheel from Pocket Relay's reviewed local vendor
// tree before Chaquopy resolves either debug or release requirements. The task
// is intentionally a normal Gradle input/output edge: no release build may use
// a stale wheel or clone/download upstream Hermes source at build time.
def pocketRelayRoot = rootProject.projectDir.parentFile
def pocketHermesWheel = new File(pocketRelayRoot, ".artifacts/wheels/hermes_agent-0.20.1-py3-none-any.whl")
def pocketJiterWheel = new File(pocketRelayRoot, ".artifacts/wheels/jiter-0.10.0-py3-none-any.whl")
def pocketPydanticCoreWheel = new File(pocketRelayRoot, ".artifacts/wheels/pydantic_core-2.46.4-cp311-cp311-android_24_arm64_v8a.whl")
// F-Droid's Debian Trixie image supplies Python 3.13, while the Android
// runtime remains explicitly pinned to CPython 3.11 below. Chaquopy 16.1
// supports any Python 3.8+ build interpreter, and local builders can still
// override this command for reproducibility experiments.
def pocketHermesBuildPython = System.getenv("POCKET_HERMES_BUILDPYTHON") ?: "python3"
def buildPocketRelayPythonWheels = tasks.register("buildPocketRelayPythonWheels", Exec) {
  workingDir pocketRelayRoot
  commandLine "bash", new File(pocketRelayRoot, "scripts/build-android-python-wheels.sh").absolutePath
  environment "PYTHON", pocketHermesBuildPython
  environment "SOURCE_DATE_EPOCH", "1704067200"
  inputs.dir(new File(pocketRelayRoot, "third_party/hermes-agent"))
  inputs.dir(new File(pocketRelayRoot, "third_party/pydantic-core"))
  inputs.dir(new File(pocketRelayRoot, "modules/pocket-hermes-supervisor/android/src/main/python/vendor/jiter-compat"))
  inputs.file(new File(pocketRelayRoot, "scripts/build-android-python-wheels.sh"))
  inputs.file(new File(pocketRelayRoot, "scripts/build-hermes-android-wheel.sh"))
  inputs.file(new File(pocketRelayRoot, "scripts/build-hermes-android-wheel.py"))
  inputs.file(new File(pocketRelayRoot, "scripts/build-jiter-compat-wheel.sh"))
  inputs.file(new File(pocketRelayRoot, "scripts/build-jiter-compat-wheel.py"))
  inputs.file(new File(pocketRelayRoot, "scripts/build-pydantic-core-android-wheel.sh"))
  inputs.file(new File(pocketRelayRoot, "scripts/repackage-wheel-deterministic.py"))
  outputs.files(pocketHermesWheel, pocketJiterWheel, pocketPydanticCoreWheel)
}

tasks.configureEach {
  if (name == "installDebugPythonRequirements" || name == "installReleasePythonRequirements") {
    dependsOn(buildPocketRelayPythonWheels)
  }
}

// Pocket Relay packages one private CPython interpreter and only the ARM64
// worker profile. No Python interpreter, shell, package installer, or runtime
// downloader is exposed through the Android UI.
chaquopy {
  defaultConfig {
    version = "3.11"
    // The embedded Android runtime is CPython 3.11. The build interpreter is
    // intentionally independent: Chaquopy 16.1 supports the F-Droid
    // buildserver's system Python 3.13, with an override retained for local
    // reproducibility validation.
    buildPython(pocketHermesBuildPython)
    pip {
      def requirementsFile = pocketHermesEmulatorTestBuild && pocketHermesAbis == ["x86_64"]
        ? "src/main/python/requirements-android-x86_64.txt"
        : "src/main/python/requirements-android.txt"
      install("-r", requirementsFile)
    }
  }
}
