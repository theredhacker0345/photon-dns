buildscript {
  repositories {
    mavenCentral()
  }
  dependencies {
    classpath "com.chaquo.python:gradle:17.0.0"
  }
}

apply plugin: 'com.android.library'
apply plugin: 'com.chaquo.python'

group = 'expo.modules.pockethermessupervisor'
version = ''

dependencies {
  implementation "androidx.security:security-crypto:1.1.0-alpha06"
}

def expoModulesCorePlugin = new File(project(":expo-modules-core").projectDir.absolutePath, "ExpoModulesCorePlugin.gradle")
def pocketHermesAbis = (System.getenv("POCKET_HERMES_ANDROID_ABIS") ?: "arm64-v8a")
  .split(",")
  .collect { it.trim() }
def pocketHermesEmulatorTestBuild = System.getenv("POCKET_HERMES_EMULATOR_TEST_BUILD") == "true"
apply from: expoModulesCorePlugin
applyKotlinExpoModulesCorePlugin()
useCoreDependencies()
useExpoPublishing()

// If you want to use the managed Android SDK versions from expo-modules-core, set this to true.
// The Android SDK versions will be bumped from time to time in SDK releases and may introduce breaking changes in your module code.
// Most of the time, you may like to manage the Android SDK versions yourself.
def useManagedAndroidSdkVersions = false
if (useManagedAndroidSdkVersions) {
  useDefaultAndroidSdkVersions()
} else {
  buildscript {
    // Simple helper that allows the root project to override versions declared by this library.
    ext.safeExtGet = { prop, fallback ->
      rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
    }
  }
  project.android {
    compileSdkVersion safeExtGet("compileSdkVersion", 36)
    ndkVersion "27.1.12297006"
    defaultConfig {
      minSdkVersion safeExtGet("minSdkVersion", 24)
      targetSdkVersion safeExtGet("targetSdkVersion", 36)
      ndk {
        abiFilters(*pocketHermesAbis)
      }
      externalNativeBuild {
        cmake {
          cppFlags "-std=c11"
        }
      }
    }
    externalNativeBuild {
      cmake {
        path file("src/main/cpp/CMakeLists.txt")
        version "3.22.1"
      }
    }
  }
}

android {
  namespace "expo.modules.pockethermessupervisor"
  buildFeatures {
    aidl true
  }
  defaultConfig {
    versionCode 1
    versionName ""
  }
  lintOptions {
    abortOnError false
  }
}

// Pocket Agent Host packages one private CPython interpreter and only the ARM64
// worker profile. No Python interpreter, shell, package installer, or runtime
// downloader is exposed through the Android UI.
chaquopy {
  defaultConfig {
    version = "3.11"
    // CI or a local builder supplies a Python 3.11 executable through
    // POCKET_HERMES_BUILDPYTHON. The fallback keeps normal developer builds
    // explicit: Chaquopy rejects an interpreter with the wrong minor version.
    buildPython(System.getenv("POCKET_HERMES_BUILDPYTHON") ?: "python3.11")
    pip {
      def requirementsFile = pocketHermesEmulatorTestBuild && pocketHermesAbis == ["x86_64"]
        ? "src/main/python/requirements-android-x86_64.txt"
        : "src/main/python/requirements-android.txt"
      install("-r", requirementsFile)
    }
  }
}
