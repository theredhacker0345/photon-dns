AutoName: Pocket Relay
Description: |-
  Pocket Relay is a FOSS Android application that transforms an idle spare phone
  into a 24/7 self-hosted AI agent relay. Designed around a private embedded CPython
  and Hermes Agent runtime, Pocket Relay runs entirely as a native Android
  foreground service without requiring or displaying any external terminal user
  interface like Termux.

  Features include secure Telegram remote control restricted to an owner allowlist,
  real-time CPU/RAM/storage telemetry, persistent background execution, and complete
  FOSS dependency and license evidence generated from the release source tree.

RepoType: git
Repo: https://gitlab.com/theredhacker0345/pocket-relay.git

Builds:
  - versionName: 1.0.0
    versionCode: 1
    commit: 4de7e88c0cd2c4f0d3e539580275ed1886c51fc6
    subdir: android
    sudo:
      - apt-get update
      - apt-get install -y nodejs npm
    init:
      - cd ..
      - npm install pnpm@9.12.0 --no-save --no-package-lock
      - ./node_modules/.bin/pnpm install --frozen-lockfile
    gradle:
      - release
    output: app/build/outputs/apk/release/app-release-unsigned.apk
    srclibs:
      - rustup@1.25.2
    prebuild:
      - $$rustup$$/rustup-init.sh -y --default-toolchain 1.88.0 --profile 
        minimal --target aarch64-linux-android
      - echo "Building Pocket Relay offline embedded Python wheels for ARM64"
      - source $HOME/.cargo/env && bash 
        ../scripts/build-android-python-wheels.sh
    scandelete:
      - node_modules
    ndk: 27.1.12297006

MaintainerNotes: |-
  Requires Android 7.0+ (API 24+) and targets ARM64. The Gradle release artifact
  is intentionally unsigned unless a maintainer explicitly supplies release-key
  material; F-Droid signs its own reproducible builds. Hermes Agent 0.20.1 and
  Pydantic Core 2.46.4 source, licenses, provenance records, and their required
  local build inputs are vendored under third_party/. The prebuild script is
  fail-closed and must run without network access. A clean F-Droid build-server
  run remains the final independent verification before publication.

AutoUpdateMode: None
UpdateCheckMode: None
