IssueTracker: https://gitlab.com/theredhacker0345/pocket-relay/issues

AutoName: Pocket Relay

RepoType: git
Repo: https://gitlab.com/theredhacker0345/pocket-relay.git

Builds:
  - versionName: 1.0.0
    versionCode: 1
    commit: 83513d331307210dac387af4c3cddcc9e6e52d16
    subdir: android/app
    sudo:
      - echo "deb https://deb.debian.org/debian bookworm main" > /etc/apt/sources.list.d/bookworm.list
      - apt-get update
      - apt-get install -y build-essential nodejs npm rustup
      - apt-get install -y -t bookworm openjdk-17-jdk-headless
    init:
      - cd ../..
      - npm exec --yes --package=pnpm@9.12.0 -- pnpm install --frozen-lockfile
      - node scripts/prepare-fdroid-expo-autolinking.mjs
    gradle:
      - yes
    prebuild:
      - rustup default 1.88.0
      - rustup target add aarch64-linux-android
      - echo "hermesEnabled=false" >> ../gradle.properties
      - echo "Building Pocket Relay offline embedded Python wheels for ARM64"
    scandelete:
      - node_modules
      - third_party/pydantic-core/vendor/regex-automata-0.4.13/tests/fuzz/testdata
    build: bash ../../scripts/build-android-python-wheels.sh
    ndk: 27.1.12297006

MaintainerNotes: |-
  Requires Android 7.0+ (API 24+) and targets ARM64. The Gradle release artifact
  is intentionally unsigned unless a maintainer explicitly supplies release-key
  material; F-Droid signs its own reproducible builds. Hermes Agent 0.20.1 and
  Pydantic Core 2.46.4 source, licenses, provenance records, and their required
  local build inputs are vendored under third_party/. The prebuild script is
  fail-closed and must run without network access. A clean F-Droid build-server
  run remains the final independent verification before publication. F-Droid
  builds use JavaScriptCore because the scanner removes React Native's prebuilt
  host Hermes compiler; normal Pocket Relay builds retain Hermes.

AutoUpdateMode: None
UpdateCheckMode: None
